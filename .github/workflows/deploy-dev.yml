name: Deploy · dev

# Triggered automatically by squash-merges into main, plus manually for
# rollbacks / forced redeploys.
on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      api_image_tag:
        description: 'Override API image tag (defaults to latest commit SHA)'
        required: false
        type: string

# Never run two deploys at once. Newer one waits, doesn't cancel.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # OIDC federation for az login (no client secret)
  packages: write   # Push to GHCR

env:
  AZURE_RESOURCE_GROUP: rg-qa-dev
  AZURE_LOCATION: eastus2
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/quantamanalitics-api

jobs:
  # ── Build + publish API image to GHCR ──────────────────────────────────────
  api-image:
    name: API · build & push image
    runs-on: ubuntu-24.04
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_ref: ${{ steps.meta.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: meta
        run: |
          TAG="${{ inputs.api_image_tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_SHA::7}"
          fi
          echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "image_ref=${GHCR_IMAGE}:${TAG}" >> "$GITHUB_OUTPUT"
          echo "Building image: ${GHCR_IMAGE}:${TAG}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: api
          file: api/Dockerfile
          push: true
          # Push both a SHA-pinned tag and `latest` so:
          #   - rollback by SHA is possible
          #   - the bicep default `apiImage` param still points at something real
          tags: |
            ${{ steps.meta.outputs.image_ref }}
            ${{ env.GHCR_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}

  # ── Apply EF Core migrations to the dev Postgres ──────────────────────────
  # Runs BEFORE deploy-infra so the new schema is in place before the new
  # image starts handling traffic. Safe for additive migrations (new tables,
  # new nullable columns) — old code on the old image keeps working against
  # the wider schema. Destructive migrations (column drops, type narrows)
  # require expand-contract: ship the additive migration in one deploy, the
  # code that stops using the old shape in the next, and the destructive
  # migration in a third. We have no destructive migrations today.
  #
  # If a migration fails, this job fails, deploy-infra never runs, and the
  # old image keeps serving the old schema. That's the desired behavior —
  # better to halt and investigate than to half-migrate behind live traffic.
  apply-migrations:
    name: DB · apply EF migrations
    runs-on: ubuntu-24.04
    needs: api-image
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install dotnet-ef
        # Pin to the GA 10.0 line. Earlier we used `--version 10.*` which
        # is ambiguous when 10.0 prereleases are still in the feed.
        run: dotnet tool install -g dotnet-ef --version 10.0.*

      - name: Restore + build (so dotnet ef runs against compiled output)
        # `dotnet ef` would otherwise build implicitly with no restore in
        # this fresh job, which has hit transient package-resolution
        # failures in the past. Explicit restore + build keeps the
        # later `--no-build` invocations cheap.
        run: |
          dotnet restore QuantamAnalytics.Api/QuantamAnalytics.Api.csproj
          dotnet build  QuantamAnalytics.Api/QuantamAnalytics.Api.csproj \
            --configuration Release --no-restore

      - name: List migration state (informational, never fails the job)
        env:
          # Double-underscore = ASP.NET Core configuration's nested-key
          # separator. This env var maps to ConnectionStrings:Postgres in
          # IConfiguration — which is what AddInfrastructure reads at
          # host-build time before dotnet ef can even discover the
          # DbContext. Setting only PG_CONN + passing `--connection` was
          # not enough: the host build threw before the migration
          # command got a chance to run.
          ConnectionStrings__Postgres: ${{ secrets.POSTGRES_CONNECTION_STRING }}
        run: |
          # Logs `Pending` / `Applied` per migration so the action log is
          # the audit trail of what this deploy will change. Tolerant of
          # failure (`|| true`) because we don't want a connection blip
          # on the list call to cancel the actual apply step.
          dotnet ef migrations list \
            --project QuantamAnalytics.Infrastructure \
            --startup-project QuantamAnalytics.Api \
            --no-build \
            --configuration Release \
            || true

      - name: Apply pending migrations
        env:
          ConnectionStrings__Postgres: ${{ secrets.POSTGRES_CONNECTION_STRING }}
        run: |
          # Idempotent: EF tracks applied migrations in __EFMigrationsHistory
          # and skips any already-present row, so re-runs of the same SHA
          # are a no-op. Each migration runs inside a transaction by
          # default — a failure rolls back to the last clean state.
          dotnet ef database update \
            --project QuantamAnalytics.Infrastructure \
            --startup-project QuantamAnalytics.Api \
            --no-build \
            --configuration Release

  # ── Apply Bicep + point Container App at the new image ────────────────────
  deploy-infra:
    name: Infra · deploy bicep with new image
    runs-on: ubuntu-24.04
    needs: [api-image, apply-migrations]
    outputs:
      api_url: ${{ steps.outputs.outputs.api_url }}
      swa_name: ${{ steps.outputs.outputs.swa_name }}
      swa_hostname: ${{ steps.outputs.outputs.swa_hostname }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Why az CLI directly instead of azure/arm-deploy@v2:
      # arm-deploy folds the multi-line `parameters` input into a single
      # space-separated string before invoking az. That breaks two things:
      #   1. CLI overrides (apiImage=...) don't override bicepparam values
      #      reliably — first observed run deployed the placeholder image
      #      even though the workflow passed the GHCR ref.
      #   2. Postgres connection string contains "Channel Binding=Disable"
      #      with a space, so the folded string splits mid-value.
      # Using `az deployment group create` with separate --parameters flags
      # is unambiguous and matches the documented bicepparam override pattern.
      - name: Deploy bicep with the freshly-built image
        uses: azure/cli@v2
        env:
          IMAGE_REF: ${{ needs.api-image.outputs.image_ref }}
          PG_CONN: ${{ secrets.POSTGRES_CONNECTION_STRING }}
          # Auth0 values are PUBLIC (OIDC discovery / token claims), so they
          # come from GitHub *variables*, not secrets. If unset, deploy still
          # succeeds and the API runs unauthenticated (with a startup warning).
          AUTH0_DOMAIN: ${{ vars.AUTH0_DOMAIN }}
          AUTH0_AUDIENCE: ${{ vars.AUTH0_AUDIENCE }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        with:
          inlineScript: |
            az deployment group create \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "deploy-${{ github.run_number }}" \
              --template-file infra/main.bicep \
              --parameters infra/main.bicepparam \
              --parameters apiImage="$IMAGE_REF" \
              --parameters postgresConnectionString="$PG_CONN" \
              --parameters auth0Domain="$AUTH0_DOMAIN" \
              --parameters auth0Audience="$AUTH0_AUDIENCE" \
              --parameters r2AccountId="$R2_ACCOUNT_ID" \
              --parameters r2AccessKeyId="$R2_ACCESS_KEY_ID" \
              --parameters r2SecretAccessKey="$R2_SECRET_ACCESS_KEY" \
              --parameters r2Bucket="$R2_BUCKET" \
              --parameters demoDataSeedOnStartup=true

      - name: Read deployment outputs
        id: outputs
        run: |
          OUTS=$(az deployment group show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "deploy-${{ github.run_number }}" \
            --query properties.outputs)
          echo "$OUTS"
          echo "api_url=$(echo "$OUTS" | jq -r '.containerAppUrl.value')" >> "$GITHUB_OUTPUT"
          echo "swa_name=$(echo "$OUTS" | jq -r '.staticWebAppName.value')" >> "$GITHUB_OUTPUT"
          echo "swa_hostname=$(echo "$OUTS" | jq -r '.staticWebAppDefaultHostname.value')" >> "$GITHUB_OUTPUT"

      - name: Smoke test API /health
        run: |
          set -euo pipefail
          URL="https://${{ steps.outputs.outputs.api_url }}/health"
          echo "Probing $URL"
          # 18 attempts × 10s = 3 minutes. Matches the readiness probe's
          # ~90s ceiling plus headroom for cold-start scale-from-zero
          # (KEDA scaler needs to spin up the replica first).
          for i in $(seq 1 18); do
            if curl --fail --silent --show-error "$URL" > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "Health probe never returned 200 — failing the deploy."
          exit 1

  # ── Build + ship Angular bundle to Static Web Apps ────────────────────────
  deploy-client:
    name: Client · build & deploy to SWA
    runs-on: ubuntu-24.04
    needs: deploy-infra
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node LTS
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build for dev (point at the freshly-deployed API)
        env:
          # Angular builds inline `environment.ts` at build time; no runtime
          # config injection. We rewrite the file in place so the prod build
          # picks up the dev API URL + Auth0 config.
          API_BASE_URL: https://${{ needs.deploy-infra.outputs.api_url }}
          AUTH0_DOMAIN: ${{ vars.AUTH0_DOMAIN }}
          AUTH0_CLIENT_ID: ${{ vars.AUTH0_CLIENT_ID }}
          AUTH0_AUDIENCE: ${{ vars.AUTH0_AUDIENCE }}
        run: |
          cat > src/environments/environment.prod.ts <<EOF
          // Auto-generated by .github/workflows/deploy-dev.yml — do not edit.
          export const environment = {
            production: true,
            apiBase: '$API_BASE_URL',
            auth0: {
              domain: '$AUTH0_DOMAIN',
              clientId: '$AUTH0_CLIENT_ID',
              audience: '$AUTH0_AUDIENCE',
            },
          };
          EOF
          npm run build -- --configuration=production

      # When skip_app_build is true, the SWA action ignores `output_location`
       # and treats `app_location` as the path to the already-built artifacts.
       # We point straight at Angular's dist/<project>/browser folder so SWA
       # finds index.html immediately without trying to invoke Oryx.
      - name: Deploy to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: client/dist/client/browser
          skip_app_build: true

      - name: Smoke test deployed SPA routes
        env:
          WEB_BASE_URL: https://${{ needs.deploy-infra.outputs.swa_hostname }}
        run: |
          set -euo pipefail

          probe() {
            local path="$1"
            local expected="$2"
            local url="${WEB_BASE_URL}${path}"

            echo "Probing ${url}"
            for i in $(seq 1 18); do
              if curl --fail --silent --show-error "$url" | tee /tmp/route.html | grep -q "$expected"; then
                return 0
              fi
              echo "Attempt $i for ${path} failed, retrying in 10s..."
              sleep 10
            done

            echo "Route ${path} never returned expected content."
            exit 1
          }

          # Angular is deployed as a client-side SPA, so direct route probes
          # receive the shared shell HTML rather than route-specific text that
          # only appears after browser hydration. Validate that each route
          # serves the app shell successfully instead of checking client-rendered
          # copy that curl cannot see.
          probe "/" "Quantam Analytics"
          probe "/jobs" "Quantam Analytics"
          probe "/does-not-exist" "Quantam Analytics"
