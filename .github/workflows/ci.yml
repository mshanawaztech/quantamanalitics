name: CI

# Gate every PR + every push to main. Branch protection on main should require
# all of these jobs to pass before squash-merge is allowed.
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

# In-flight PR runs cancel themselves when a new commit arrives. Main runs
# never cancel — they're the source of truth for "did this commit pass".
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  api:
    name: API · build + test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('api/**/*.csproj', 'api/Directory.Build.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore QuantamAnalytics.sln

      - name: Verify formatting (no diffs allowed)
        run: dotnet format QuantamAnalytics.sln --verify-no-changes --severity warn

      - name: Build (Release, warnings as errors via Directory.Build.props)
        run: dotnet build QuantamAnalytics.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test QuantamAnalytics.sln --configuration Release --no-build --logger "trx;LogFileName=test_results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: api/**/TestResults/*.trx
          retention-days: 7

  client:
    name: Client · build + lint
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node LTS
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies (deterministic)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (production)
        run: npm run build -- --configuration=production

      - name: Upload Angular build
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist/
          retention-days: 7

  infra:
    name: Infra · bicep lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Azure CLI (already on the runner; check version)
        run: az --version

      - name: Lint main.bicep
        run: az bicep build --file infra/main.bicep --outdir /tmp/bicep-out

      - name: Lint each module
        run: |
          set -euo pipefail
          for f in infra/modules/*.bicep; do
            echo "::group::$f"
            az bicep build --file "$f" --outdir /tmp/bicep-out
            echo "::endgroup::"
          done

  docker:
    name: API · docker build (no push)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (cache only, do not push)
        uses: docker/build-push-action@v6
        with:
          context: api
          file: api/Dockerfile
          push: false
          tags: quantamanalitics-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
